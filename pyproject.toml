[project]
name = "ops-dashboard"
version = "2.0.0"
description = "Read-only production ops dashboard: a standalone HTML snapshot and a live local view"
requires-python = ">=3.9"
dependencies = [
    "azure-identity>=1.17,<2",
    "azure-monitor-query>=1.4,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
live = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
dev = [
    "pytest>=8,<9",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ops_dashboard*"]

[tool.setuptools.package-data]
ops_dashboard = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
